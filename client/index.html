<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="TaskCollab: plan projects, organize tasks, collaborate with your team, and keep every deadline within reach." />
    <meta name="theme-color" content="#1c1e22" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TaskCollab</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      (function () {
        try {
          var saved = localStorage.getItem('taskcollab_theme') || 'system';
          var dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
